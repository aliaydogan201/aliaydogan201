name: ALICOTV Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ALICO_KEYSTORE_PASSWORD: ${{ secrets.ALICO_KEYSTORE_PASSWORD }}
      ALICO_KEY_PASSWORD: ${{ secrets.ALICO_KEY_PASSWORD }}
      ALICO_KEY_ALIAS: ${{ secrets.ALICO_KEY_ALIAS }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
      - name: Android SDK 35 kur
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Kalıcı imza anahtarını hazırla
        shell: bash
        env:
          ALICO_KEYSTORE_BASE64: ${{ secrets.ALICO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ALICO_KEYSTORE_BASE64" || -z "$ALICO_KEYSTORE_PASSWORD" || -z "$ALICO_KEY_PASSWORD" || -z "$ALICO_KEY_ALIAS" ]]; then
            echo "::error::Kalıcı imza Secrets eksik. KURULUM-v52.md dosyasındaki dört Secret değerini tanımlayın."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$ALICO_KEYSTORE_BASE64" | base64 --decode > signing/alico-update.jks
          chmod 600 signing/alico-update.jks
      - name: APK derle
        shell: bash
        run: |
          set -o pipefail
          gradle --version
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee build-log.txt
      - name: Derleme günlüğünü yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICOTV-build-log
          path: build-log.txt
          if-no-files-found: ignore
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: ALICOTV-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Geçici imza dosyasını temizle
        if: always()
        shell: bash
        run: rm -f signing/alico-update.jks
