name: ALICOTV Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
      - name: Android SDK 35 kur
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: APK derle
        shell: bash
        run: |
          set -o pipefail
          gradle --version
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee build-log.txt
      - name: Derleme günlüğünü yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICOTV-build-log
          path: build-log.txt
          if-no-files-found: ignore
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: ALICOTV-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
